<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Game Giải Trí</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; margin: 0; display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .hub-container { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 500px; overflow: hidden; }
        
        /* Header Profile */
        .user-header { background: #1e293b; padding: 20px; display: flex; align-items: center; justify-content: space-between; color: white; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        #avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #cbd5e1; background: white; }
        .user-info h3 { margin: 0 0 5px 0; font-size: 1.2rem; }
        .badge { background: #3b82f6; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge.guest { background: #64748b; }
        
        /* Panel Đăng nhập / Đăng ký (Dành cho Khách) */
        .auth-panel { background: #e0f2fe; padding: 20px; border-bottom: 1px solid #bae6fd; }
        .auth-panel h4 { margin: 0 0 15px 0; color: #0284c7; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .input-group input { padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 1rem; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #cbd5e1; color: #1e293b; }
        .btn-secondary:hover { background: #94a3b8; }
        .btn-google { width: 100%; background: white; color: #334155; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-google:hover { background: #f1f5f9; }
        .divider { text-align: center; margin: 10px 0; font-size: 0.85rem; color: #64748b; }

        /* Game List */
        .game-section { padding: 20px; }
        .game-section h3 { margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .game-item { display: flex; align-items: center; justify-content: space-between; background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 12px; text-decoration: none; color: #1e293b; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: 0.2s; }
        .game-item:hover { border-color: #3b82f6; box-shadow: 0 5px 15px rgba(59, 130, 246, 0.1); transform: translateY(-2px); }
        .game-title { font-weight: bold; font-size: 1.1rem; }
        
        .btn-logout { background: transparent; color: #fca5a5; border: 1px solid #fca5a5; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .btn-logout:hover { background: #fca5a5; color: #7f1d1d; }
    </style>
</head>
<body>

    <div class="hub-container">
        <!-- Header -->
        <div class="user-header">
            <div class="user-profile">
                <img id="avatar" src="" alt="Avatar">
                <div class="user-info">
                    <h3 id="userName">Đang tải...</h3>
                    <span id="userRole" class="badge">...</span>
                </div>
            </div>
            <button id="btnLogout" class="btn-logout" style="display:none;">Đăng xuất</button>
        </div>

        <!-- Khung định danh (Chỉ hiện khi là Khách) -->
        <div id="authPanel" class="auth-panel" style="display:none;">
            <h4>🔒 Nâng cấp tài khoản để lưu xếp hạng</h4>
            <div class="input-group">
                <input type="email" id="emailInput" placeholder="Nhập Email">
                <input type="password" id="passInput" placeholder="Nhập Mật khẩu (tối thiểu 6 ký tự)">
            </div>
            <div class="btn-group">
                <button id="btnEmailLogin" class="btn btn-primary">Đăng nhập</button>
                <button id="btnEmailReg" class="btn btn-secondary">Đăng ký mới</button>
            </div>
            <div class="divider">--- HOẶC ---</div>
            <button id="btnGoogle" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Đăng nhập bằng Google
            </button>
        </div>

        <!-- Danh sách Trò chơi -->
        <div class="game-section">
            <h3>🎮 Danh sách Trò chơi</h3>
            
            <a href="./games/caro/index.html" class="game-item">
                <span class="game-title">⭕ Cờ Caro Online</span>
                <span>Chơi ngay ➔</span>
            </a>
            
            <a href="#" class="game-item" style="opacity: 0.6; cursor: not-allowed;">
                <span class="game-title">♟️ Cờ Vua</span>
                <span style="font-size: 0.85rem; background: #e2e8f0; padding: 3px 8px; border-radius: 12px;">Sắp ra mắt</span>
            </a>
        </div>
    </div>

    <!-- Nạp Firebase và Script -->
    <script type="module" src="hub.js"></script>
</body>
</html>
