<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Game Giải Trí</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        .btn-google { background: #4285F4; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; font-weight: bold; transition: 0.2s; }
        .btn-google:hover { background: #357ae8; }
        
        /* Ẩn danh sách game ban đầu */
        #gameMenu { display: none; margin-top: 20px; text-align: left; }
        .game-item { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 10px; text-decoration: none; color: #1e293b; transition: 0.2s; }
        .game-item:hover { background: #e0f2fe; border-color: #bae6fd; transform: translateY(-2px); }
        .game-title { font-weight: bold; font-size: 18px; }
        
        #userInfo { display: none; flex-direction: column; align-items: center; margin-bottom: 20px; }
        #avatar { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #cbd5e1; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎮 Game Hub</h1>
        
        <!-- Khung Đăng nhập -->
        <div id="loginSection">
            <p style="color: #64748b; margin-bottom: 20px;">Đăng nhập để lưu lịch sử và chơi online</p>
            <button class="btn-google" id="btnLogin">
                Đăng nhập bằng Google
            </button>
        </div>

        <!-- Khung User Info -->
        <div id="userInfo">
            <img id="avatar" src="" alt="Avatar">
            <h3 id="userName" style="margin: 10px 0 0 0;">Tên người chơi</h3>
            <button class="btn-logout" id="btnLogout">Đăng xuất</button>
        </div>

        <!-- Danh sách Game -->
        <div id="gameMenu">
            <h3 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">Chọn trò chơi</h3>
            
            <a href="./games/caro/index.html" class="game-item">
                <span class="game-title">⭕ Cờ Caro</span>
                <span>Chơi ngay ➔</span>
            </a>
            
            <a href="#" class="game-item" style="opacity: 0.5; cursor: not-allowed;">
                <span class="game-title">♟️ Cờ Vua (Sắp ra mắt)</span>
                <span>Đang phát triển</span>
            </a>
        </div>
    </div>

    <!-- Nạp Firebase và Script cho Hub -->
    <script type="module" src="hub.js"></script>
</body>
</html>
